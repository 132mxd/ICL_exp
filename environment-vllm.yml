name: vllm

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      # Model serving. Keep this pinned because vLLM, PyTorch, CUDA kernels,
      # and FlashInfer must remain mutually compatible.
      - vllm==0.30.0

      # Direct dependencies used by the ICL evaluation scripts.
      - datasets==5.1.0
      - transformers==5.17.0
      - numpy==2.2.6
      - requests==2.34.2
      - tqdm==4.70.1
      - huggingface-hub==1.33.0
      - sentencepiece==0.2.2
